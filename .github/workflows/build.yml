
name: Build TC2 Walkmod bootstrap

on:
  workflow_dispatch:
  push:
    branches: [ main, master, starter-06-safe-scan, starter-07-readable-sections, starter-08-referenced-object-capture ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v7

      - name: Configure x64 build
        run: cmake -S . -B build -A x64

      - name: Compile DLL
        run: cmake --build build --config Release

      - name: Upload DLL and symbols
        uses: actions/upload-artifact@v7
        with:
          name: TC2-Walkmod-bootstrap-x64
          path: |
            build/Release/dinput8.dll
            build/Release/dinput8.pdb
          if-no-files-found: error
