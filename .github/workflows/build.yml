
name: Build TC2 Walkmod bootstrap

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Configure x64 build
        run: cmake -S . -B build -A x64

      - name: Compile DLL
        run: cmake --build build --config Release

      - name: Upload DLL and symbols
        uses: actions/upload-artifact@v4
        with:
          name: TC2-Walkmod-bootstrap-x64
          path: |
            build/Release/dinput8.dll
            build/Release/dinput8.pdb
          if-no-files-found: error
